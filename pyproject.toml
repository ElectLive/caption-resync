[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caption-resync"
version = "1.0.0"
description = "Batch-fix out-of-sync subtitles: shift, stretch, convert SRT/WebVTT, strip styles, validate"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amir Hussain" }]
requires-python = ">=3.9"
keywords = ["subtitles", "srt", "webvtt", "vtt", "caption", "sync", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

[project.scripts]
caption-resync = "caption_resync:main"

[project.urls]
Homepage = "https://github.com/aamirtechs/caption-resync"
Issues = "https://github.com/aamirtechs/caption-resync/issues"
